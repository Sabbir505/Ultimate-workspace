# Build & release Relay for Windows (NSIS).
#
# Triggers on tag push (v*) or manual dispatch. The job:
# 1. Installs Tauri system deps.
# 2. Builds the relay-browser-mcp sidecar + stages it.
# 3. Builds the Tauri bundle (npm run tauri build), producing an unsigned
#    (Windows) installer.
# 4. Uploads the bundle as a workflow artifact.
#
# After the job completes, the `release` job downloads the artifact, signs the
# NSIS installer with the updater key, generates `latest.json`, and creates the
# GitHub Release — in the PUBLIC releases-only repo (Sabbir505/relay-releases),
# because the source repo is private and release assets must stay publicly
# downloadable. The landing page download links and the Tauri updater endpoint
# both point there.
#
# Required secrets (settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          - contents of .tauri/relay-update.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - empty string (signer is invoked -p "")
#   RELEASES_TOKEN                     - fine-grained PAT with Contents: Read/write
#                                        on Sabbir505/relay-releases only (the
#                                        built-in GITHUB_TOKEN cannot publish to
#                                        another repository)

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows-only by product decision (2026-09-19): the app ships as a Windows
  # NSIS bundle and the bundled Python/LibreOffice staging has no macOS target,
  # so a macOS compile check cannot be satisfied. The former check-macos job
  # (B-2) failed on every run for exactly that reason and was removed.
  # Cross-platform compile checking returns when macOS/Linux support lands.
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm deps
        run: npm ci

      # Resources MUST be staged before any `cargo build` — even the sidecar
      # binary triggers the main build script (same Cargo package), which checks
      # the resource globs.
      - name: Stage bundled Python
        run: node scripts/fetch-bundled-python.mjs

      - name: Stage bundled LibreOffice
        run: node scripts/fetch-bundled-libreoffice.mjs

      - name: Verify staged resources
        run: |
          Write-Host "=== resources/python ==="
          if (Test-Path "src-tauri/resources/python/python.exe") {
            Write-Host "✓ python.exe found"
            Get-ChildItem "src-tauri/resources/python" -Directory | Select-Object -First 5 | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "✗ python.exe NOT FOUND"
            Get-ChildItem "src-tauri/resources" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          }
          Write-Host "=== resources/libreoffice ==="
          if (Test-Path "src-tauri/resources/libreoffice/program/soffice.exe") {
            Write-Host "✓ soffice.exe found"
          } else {
            Write-Host "✗ soffice.exe NOT FOUND"
          }

      # Sidecar build: resources exist now, so the build script won't fail.
      # BOTH sidecar placeholders must exist before the FIRST cargo build —
      # the sidecars share the main package, so its build script runs during
      # any cargo build and validates every externalBin path in tauri.conf.json.
      - name: Stage sidecar placeholders
        working-directory: src-tauri
        run: |
          New-Item -ItemType Directory -Force "binaries" | Out-Null
          New-Item -ItemType File -Force "binaries/relay-browser-mcp-x86_64-pc-windows-msvc.exe" | Out-Null
          New-Item -ItemType File -Force "binaries/relay-automation-x86_64-pc-windows-msvc.exe" | Out-Null

      - name: Build browser-mcp sidecar
        working-directory: src-tauri
        run: |
          cargo build --release --bin relay-browser-mcp
          node ../scripts/stage-browser-mcp.mjs

      # Headless automation runner (the "Run while closed" Task Scheduler
      # target). Placeholder already staged above.
      - name: Build automation sidecar
        working-directory: src-tauri
        run: |
          cargo build --release --bin relay-automation
          node ../scripts/stage-automation.mjs

      - name: Build (do NOT set signing env vars — the release job signs)
        env:
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Restore signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p .tauri
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > .tauri/relay-update.key
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" > .tauri/relay-update.key.password
          chmod 600 .tauri/relay-update.key

      - name: Sign + generate latest.json
        # npm run release:latest-json expects the bundle at
        # src-tauri/target/release/bundle/nsis/, so we copy the downloaded
        # artifact into the layout the helper expects before running.
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/release/bundle/nsis
          cp -r artifacts/windows/* src-tauri/target/release/bundle/nsis/ 2>/dev/null || true
          npm run release:latest-json -- --notes-file CHANGELOG.md

      - name: Extract release notes
        # Cross-repo releases can't use generate_release_notes (the tag has no
        # commit history in the releases repo), so the changelog text that the
        # updater banner shows doubles as the release body.
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('src-tauri/target/release/bundle/latest.json','utf8'));fs.writeFileSync('release-notes.md',j.notes||'')"

      - name: Publish GitHub Release (public releases repo)
        uses: softprops/action-gh-release@v2
        with:
          repository: Sabbir505/relay-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/latest.json
