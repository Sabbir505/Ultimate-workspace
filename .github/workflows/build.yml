# Build & release Conduit for Windows (NSIS) and Linux (AppImage + deb).
#
# Triggers on tag push (v*). For each platform, the job:
# 1. Installs Tauri system deps (libwebkit2gtk on Linux, MSVC on Windows).
# 2. Builds the Tauri bundle (npm run tauri build), producing a signed (Windows)
#    or unsigned (Linux) installer.
# 3. Uploads the bundle as a workflow artifact.
#
# After both jobs complete, the `release` job downloads every artifact, signs
# the Linux AppImage with the same updater key, generates a cross-platform
# `latest.json`, and creates the GitHub Release. Each platform installer +
# the shared `latest.json` are attached as release assets.
#
# Required secrets (settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          - contents of .tauri/conduit-update.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - empty string (signer is invoked -p "")

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm deps
        run: npm ci

      # tauri build only compiles the main binary — the conduit-browser-mcp
      # sidecar must be built explicitly. tauri-build validates the externalBin
      # path at compile time, so touch a placeholder first, then stage the real
      # binary once cargo has produced it.
      - name: Build browser-mcp sidecar
        working-directory: src-tauri
        run: |
          New-Item -ItemType File -Force "binaries/conduit-browser-mcp-x86_64-pc-windows-msvc.exe" | Out-Null
          cargo build --release --bin conduit-browser-mcp
          node ../scripts/stage-browser-mcp.mjs

      - name: Build (do NOT set signing env vars — the release job signs)
        env:
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            wget

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm deps
        run: npm ci

      # tauri build only compiles the main binary — the conduit-browser-mcp
      # sidecar must be built explicitly. tauri-build validates the externalBin
      # path at compile time, so touch a placeholder first, then stage the real
      # binary once cargo has produced it. llama-server is staged for real
      # before compiling (it only needs downloads, not cargo artifacts).
      - name: Build browser-mcp sidecar + stage llama-server
        working-directory: src-tauri
        run: |
          node ../scripts/stage-llama-server.mjs
          touch binaries/conduit-browser-mcp-x86_64-unknown-linux-gnu
          cargo build --release --bin conduit-browser-mcp
          node ../scripts/stage-browser-mcp.mjs

      - name: Build
        env:
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        run: npm run tauri build

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-windows, build-linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Download Linux bundles
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: artifacts/linux

      - name: Restore signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/.tauri
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > src-tauri/.tauri/conduit-update.key
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" > src-tauri/.tauri/conduit-update.key.password
          chmod 600 src-tauri/.tauri/conduit-update.key

      - name: Sign + generate latest.json
        # npm run release:latest-json expects the bundle at
        # src-tauri/target/release/bundle/{nsis,appimage,deb}/, so we copy the
        # downloaded artifacts into the layout the helper expects before running.
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/release/bundle
          cp -r artifacts/windows/* src-tauri/target/release/bundle/nsis/ 2>/dev/null || true
          mkdir -p src-tauri/target/release/bundle/appimage
          mkdir -p src-tauri/target/release/bundle/deb
          cp artifacts/linux/*.AppImage src-tauri/target/release/bundle/appimage/ 2>/dev/null || true
          cp artifacts/linux/*.deb      src-tauri/target/release/bundle/deb/      2>/dev/null || true
          npm run release:latest-json -- --notes "See CHANGELOG.md for release notes."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/latest.json
