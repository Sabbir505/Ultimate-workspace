# Build & release Conduit for Windows (NSIS).
#
# Triggers on tag push (v*) or manual dispatch. The job:
# 1. Installs Tauri system deps.
# 2. Builds the conduit-browser-mcp sidecar + stages it.
# 3. Builds the Tauri bundle (npm run tauri build), producing an unsigned
#    (Windows) installer.
# 4. Uploads the bundle as a workflow artifact.
#
# After the job completes, the `release` job downloads the artifact, signs the
# NSIS installer with the updater key, generates `latest.json`, and creates the
# GitHub Release. The installer + `latest.json` are attached as release assets.
#
# Required secrets (settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          - contents of .tauri/conduit-update.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - empty string (signer is invoked -p "")

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # B-2: compile-only check on macOS. The browser-pane module and several
  # platform helpers broke macOS compilation silently (CI built Windows
  # only); this job catches cross-platform breakage at check time without
  # producing a release bundle.
  check-macos:
    name: Check (macOS, compile-only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --workspace

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm deps
        run: npm ci

      # Resources MUST be staged before any `cargo build` — even the sidecar
      # binary triggers the main build script (same Cargo package), which checks
      # the resource globs.
      - name: Stage bundled Python
        run: node scripts/fetch-bundled-python.mjs

      - name: Stage bundled LibreOffice
        run: node scripts/fetch-bundled-libreoffice.mjs

      - name: Verify staged resources
        run: |
          Write-Host "=== resources/python ==="
          if (Test-Path "src-tauri/resources/python/python.exe") {
            Write-Host "✓ python.exe found"
            Get-ChildItem "src-tauri/resources/python" -Directory | Select-Object -First 5 | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "✗ python.exe NOT FOUND"
            Get-ChildItem "src-tauri/resources" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          }
          Write-Host "=== resources/libreoffice ==="
          if (Test-Path "src-tauri/resources/libreoffice/program/soffice.exe") {
            Write-Host "✓ soffice.exe found"
          } else {
            Write-Host "✗ soffice.exe NOT FOUND"
          }

      # Sidecar build: resources exist now, so the build script won't fail.
      - name: Build browser-mcp sidecar
        working-directory: src-tauri
        run: |
          New-Item -ItemType File -Force "binaries/conduit-browser-mcp-x86_64-pc-windows-msvc.exe" | Out-Null
          cargo build --release --bin conduit-browser-mcp
          node ../scripts/stage-browser-mcp.mjs

      # Headless automation runner (the "Run while closed" Task Scheduler
      # target). Same placeholder-first dance: the Tauri build script
      # validates externalBin paths before compiling anything.
      - name: Build automation sidecar
        working-directory: src-tauri
        run: |
          New-Item -ItemType File -Force "binaries/conduit-automation-x86_64-pc-windows-msvc.exe" | Out-Null
          cargo build --release --bin conduit-automation
          node ../scripts/stage-automation.mjs

      - name: Build (do NOT set signing env vars — the release job signs)
        env:
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Restore signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p .tauri
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > .tauri/conduit-update.key
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" > .tauri/conduit-update.key.password
          chmod 600 .tauri/conduit-update.key

      - name: Sign + generate latest.json
        # npm run release:latest-json expects the bundle at
        # src-tauri/target/release/bundle/nsis/, so we copy the downloaded
        # artifact into the layout the helper expects before running.
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/release/bundle/nsis
          cp -r artifacts/windows/* src-tauri/target/release/bundle/nsis/ 2>/dev/null || true
          npm run release:latest-json -- --notes-file CHANGELOG.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/latest.json
