[package]
name = "conduit"
version = "0.1.0"
description = "Conduit — a local-first, multi-pane desktop shell for AI coding agents"
authors = ["you"]
edition = "2021"

[lib]
name = "conduit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables Window::add_child / WebviewBuilder — required for the
# native child-webview browser panes (see src/browser.rs).
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
parking_lot = "0.12"
regex = "1"
strip-ansi-escapes = "0.2"
window-vibrancy = "0.5"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"

# OS keychain for per-project secrets (PRD §7.16). Target-specific features so
# Linux (which has no native backend enabled here) still compiles — secrets.rs
# falls back to obfuscated-at-rest storage there and logs the deviation.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
