[package]
name = "conduit"
version = "0.4.1"
description = "Conduit — a local-first, multi-pane desktop shell for AI coding agents"
authors = ["you"]
edition = "2021"
# Two binaries now ship (the app + the standalone conduit-browser-mcp server).
# `cargo run` / `tauri dev` must default to the app, not the MCP binary.
default-run = "conduit"

[lib]
name = "conduit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Standalone MCP server binary: speaks stdio JSON-RPC to a harness (Claude
# Code/Kimi Code) and forwards each tool call into the running Conduit app over
# a loopback WebSocket (see src/browser_mcp.rs + src/bin/conduit_browser_mcp.rs).
# Shares conduit_lib only for the BROWSER_MCP_PORT constant — does NOT link Tauri.
[[bin]]
name = "conduit-browser-mcp"
path = "src/bin/conduit_browser_mcp.rs"

# Headless automation runner (see automations.rs): `conduit-automation run <id>`
# executes one scheduled turn with no GUI. This is the entry point a Windows
# Task Scheduler task invokes so automations can fire while Conduit is closed.
[[bin]]
name = "conduit-automation"
path = "src/bin/conduit_automation.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Embeds a comctl32 v6 application manifest into test harnesses only (see
# build.rs) so `cargo test` binaries survive load-time import snapping.
embed-resource = "3"

[dependencies]
# "unstable" enables Window::add_child / WebviewBuilder — required for the
# native child-webview browser panes (see src/browser.rs).
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
# TOML parsing for reading CLI harness configs (Kimi's config.toml) — see
# harness_config.rs.
toml = "0.8"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
# Virtual terminal screen model fed from each pane's raw output. The phone
# app renders `Screen::contents_formatted()` (a faithful grid snapshot with
# SGR styling) instead of the raw output stream, whose TUI redraw frames are
# unreadable when concatenated.
vt100 = "0.16"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
parking_lot = "0.12"
# Per-project filesystem watcher that drives the `project:fs-changed` Tauri
# event. Replaces the 4-8s polling loops in `useGitStatusPolling` /
# `DevDiffPanel` / `BranchDropdown` — git status is event-driven now: the OS
# tells us when a file under a project changes, we coalesce + debounce, then
# emit. notify uses the native backend per platform (ReadDirectoryChangesW /
# inotify / FSEvents). Pure-Rust, no extra native deps.
notify = "6"
regex = "1"
strip-ansi-escapes = "0.2"
window-vibrancy = "0.5"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json", "multipart"], default-features = false }
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "process", "time", "sync", "net", "io-util", "macros"] }
# Loopback WebSocket bridge between the conduit-browser-mcp binary and the
# running Tauri app (browser_mcp.rs). Used by both the in-app server and the
# standalone binary's client.
tokio-tungstenite = { version = "0.24", features = ["connect"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
# SHA-256 for OAuth PKCE code_challenge (S256) in the Connectors OAuth flow.
sha2 = "0.10"
# Random bytes for PKCE code_verifier generation (Connectors OAuth flow).
rand = "0.8"
# Percent-encoding of OAuth authorize-URL query parameters.
urlencoding = "2"
# URL parsing for the OAuth redirect-callback interception.
url = "2"
# Official Rust MCP client SDK — connects to vendor-hosted remote MCP servers
# (e.g. mcp.notion.com) over streamable-HTTP when a connector is attached.
# Pinned to the 3.0 beta: the 0.1.x line lacks the streamable-HTTP client
# transport entirely (only child-process / io / sse-server features). The
# `reqwest` feature gives rmcp's own reqwest a rustls TLS provider so its
# default client can reach https:// endpoints; we pass the OAuth bearer via
# `config.auth_header(token)` rather than building our own reqwest::Client
# (our app reqwest is pinned to 0.12, rmcp needs 0.13 — sharing a client would
# require a cross-major bump of the app's reqwest, out of scope here).
rmcp = { version = "=3.0.0-beta.2", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
# Text extraction from PDF attachments in the Chat tab.
pdf-extract = "0.7"
# Text extraction from legacy binary Office attachments (.doc/.ppt/.xls) — the
# OLE2/CFBF formats that the zip-based docx/pptx path can't read. Also covers
# the modern OOXML formats, but the existing tolerant renderers in office.rs
# are kept for the artifact preview (HTML fidelity); this crate is used for
# plain-text extraction to feed the chat model.
office_oxide = "0.1.8"
# Local-models feature: recursive folder walk for .gguf scanning, system info
# for memory-sanity checks, and platform-aware home-dir resolution.
walkdir = "2"
sysinfo = "0.32"
dirs = "5"
# NVML dynamic loading for free-VRAM probing on Windows. Only the
# LibraryLoader + Foundation pieces (LoadLibraryA, GetProcAddress) are used,
# so we don't pull in the full surface. The crate is `windows-sys` 0.61 to
# match what tauri 2 already vendors.
# Cross-platform system-browser opener (xdg-open / open / start) for the
# Connectors OAuth flow (opens the vendor's authorize URL in the user's
# default browser, then captures the redirect on a loopback server).
open = "5"
# Pure-Rust ripgrep-style regex engine for the `search_content` chat tool.
# The `grep` crate provides a streaming `Searcher` so memory stays bounded
# by line length, not file size, even when scanning huge source files.
grep = "0.3"
# Glob pattern matching for the `search_content` tool's `glob` parameter
# (`*.rs`, `**/test_*.py`, etc.). Pure-Rust, no native deps.
globset = "0.4"
# Cron schedule parsing for the Automations scheduler (automations.rs):
# evaluates each automation's 5-field cron expression against its last run.
cron = "0.12"
# chrono types are named directly in the scheduler's due-time math (cron's
# API is generic over them); clock only, no formatting/serde.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
# OS keychain for per-project secrets (PRD §7.16). Target-specific features so
# Linux (which has no native backend enabled here) still compiles — secrets.rs
# falls back to obfuscated-at-rest storage there and logs the deviation.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# NVML dynamic-load entry points for free-VRAM probing (see chat/local_models.rs).
# Feature flags match the small surface we actually use.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
# WebView2 CapturePreview for the browser_screenshot tool (browser.rs). Versions
# pinned to what tauri 2.11 already links so no duplicate windows crate lands.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Linux: Secret Service API via D-Bus (gnome-keyring, KWallet, KeePassXC, etc.)
# The user must have a Secret Service implementation running on their session.
# Falls back gracefully if no service is available (keyring crate logs a warning
# and operations return Err — secrets.rs surfaces the error to the caller).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native", "sync-secret-service"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
